# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=karatsuba
mod_name=Karatsuba
mod_version=1.0.0
maven_group=dev.px
archives_base_name=karatsuba

# Minecraft / Fabric
# Version reference: https://fabricmc.net/develop/
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.9
fabric_api_version=0.119.2+1.21.4

# Tooling
# Matched to Core's version so both halves are processed by the same Lombok.
lombok_version=1.18.30

# Local development
# The name the dev client plays as. The dev server runs offline, so this needs no
# account; it is also who dev/server ops on first start.
dev_username=Dev
# Paper runs the same version as the mod (minecraft_version above).
# Grim publishes its Fabric and Paper builds under the same version number, so the
# number alone fetches the Fabric jar. This is the Modrinth version id of the Paper
# build of 2.3.73, the latest "release": https://modrinth.com/plugin/grimac/versions
grim_version=1FIGlM6Q
# JetBrains Runtime with DCEVM and HotswapAgent, for "Client (Debug)" and runClientDebug.
# See dev/README.md for how it was installed.
jbr_version=21
