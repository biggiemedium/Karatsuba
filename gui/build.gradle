// Local copy of Minecraft-Client-Core's `gui` library
// (https://github.com/biggiemedium/Minecraft-Client-Core), at release 2.4.
//
// Widgets, containers, popups and input routing built on Core's layout and render
// facade, plus Core's old click GUI, moved here as `dev.px.gui.legacy`. Like Core
// it has NO Minecraft on its classpath. Do not add a Minecraft dependency here.

plugins {
    id 'java-library'
}

group = 'dev.px'
version = '2.4'

// Kept at 8 (as upstream), like Core.
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
}

// Upstream's suite is a plain main() with its own assertions, not JUnit, so the
// `test` task never sees it. This is how it gets run: `gradlew :gui:smoke`.
tasks.register('smoke', JavaExec) {
    group = 'verification'
    description = 'Runs the GUI test suite (no Minecraft).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.px.gui.test.GuiSmokeTest'
}

// A runnable visual harness: a real window, a real renderer, the GUI with its
// layout and hit areas drawn over it as a wireframe. Test tooling only.
tasks.register('visual', JavaExec) {
    group = 'verification'
    description = 'Opens a window and draws the GUI, with a wireframe of its layout, using NanoVG.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.px.gui.test.visual.GuiVisualTest'
    // GLFW must own the first thread on macOS, or creating a window aborts.
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

dependencies {
    api project(':core')
    // Checks and FakePlatform for the suites, and the NanoVG window for `visual`.
    testImplementation testFixtures(project(':core'))

    // Lombok: compile-time only, nothing lands in the jar.
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Gson ships with Minecraft on every version, so it is compileOnly here; the
    // tests run with no Minecraft to supply it.
    compileOnly 'com.google.code.gson:gson:2.8.9'
    testImplementation 'com.google.code.gson:gson:2.8.9'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-unchecked' << '-parameters'
}
