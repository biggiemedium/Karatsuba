pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'Karatsuba'

// Local copy of Minecraft-Client-Core, editable in place (see core/build.gradle).
include 'core'

// Core's optional combat library (crystal/bed/anchor searches, holes, traps,
// placement), also a local copy. Depends on :core.
include 'combat'

// Core's optional projectile library (trajectories, hits, bow and throw aim),
// also a local copy. Depends on :core.
include 'projectile'

// Core's optional GUI library (widgets, containers, and Core's old click GUI as
// dev.px.gui.legacy), also a local copy. Depends on :core.
include 'gui'

// A local Paper server running Grim, offline, for testing against an anticheat
// without an account. Not part of the mod; see dev/server/build.gradle.
include 'dev:server'
