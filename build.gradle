plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

// Core and its libraries must be evaluated before the jar block below can read their
// source sets.
evaluationDependsOn(':core')
evaluationDependsOn(':combat')
evaluationDependsOn(':projectile')
evaluationDependsOn(':gui')

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// NanoVG is the adapter's 2D backend. Minecraft ships LWJGL 3.3.3 but not the
// NanoVG bindings, so we add those and their natives ourselves. Each is fetched
// without transitives: pulling lwjgl core in would put a second copy on the
// classpath alongside the one the game already loaded.
def lwjgl_version = '3.3.3'
def nanovg_natives = ['natives-windows', 'natives-linux', 'natives-macos', 'natives-macos-arm64']

configurations {
	// Compiled and run against, and folded into the mod jar by the jar task below.
	nanovg
	implementation.extendsFrom nanovg
}

// Mixin's hot-swap agent is the sponge-mixin jar itself, which sits in Gradle's
// cache under a hash. prepareDevClient copies it to one fixed path so the debug
// client's run configuration can name it.
def devMixinAgent = file('.gradle/dev-agents/sponge-mixin.jar')

loom {
	// Keeps client-only code in src/client so it can never leak onto a server.
	splitEnvironmentSourceSets()

	mods {
		register(project.mod_id) {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// A client-only mod has nothing to run on Loom's dedicated server, and its
		// runServer task would share a name with dev/server's Paper one, so that
		// `gradlew runServer` started both. The dev server is dev/server.
		remove(getByName('server'))

		// The client under JetBrains Runtime with hot reload: DCEVM redefines
		// classes structurally (new fields and methods, not just bodies),
		// HotswapAgent refreshes what caches them, and Mixin's own agent re-applies
		// a mixin whose body changed. The IDE equivalent is the shared
		// "Client (Debug)" run configuration, written by hand because it needs JBR
		// as its JRE and Loom's generated configurations cannot name one.
		clientDebug {
			inherit client
			configName = 'Client (Debug)'
			ideConfigGenerated false
			vmArgs '-XX:+AllowEnhancedClassRedefinition', '-XX:HotswapAgent=fatjar',
					// HotswapAgent patches classes the game loads, such as Log4j's,
					// to call back into itself. Fabric's loader hides everything not
					// on the game's own classpath from those classes, the agent
					// included, so without this the client dies before its first log
					// line with NoClassDefFoundError: org/hotswap/agent/...
					'-Dfabric.debug.disableClassPathIsolation=true',
					'-Dmixin.hotSwap=true', "-javaagent:${devMixinAgent.absolutePath}"
			// Offline name, so the dev server's ops list knows who this is.
			programArgs '--username', project.dev_username
		}
	}
}

// Loom registers its run tasks before the server run above is removed, so its
// runServer outlives it. Disabled, `gradlew runServer` runs only dev/server's.
tasks.named('runServer') {
	enabled = false
	setDependsOn([])
	group = null
	description = 'Disabled: the mod is client-only. The dev server is :dev:server:runServer.'
}

def prepareDevClient = tasks.register('prepareDevClient', Copy) {
	group = 'dev client'
	description = 'Copies the Mixin hot-swap agent to .gradle/dev-agents for the debug client.'
	from(configurations.clientRuntimeClasspath.filter { it.name.startsWith('sponge-mixin-') })
	into(devMixinAgent.parentFile)
	rename { devMixinAgent.name }
}

tasks.named('runClientDebug') {
	group = 'dev client'
	dependsOn prepareDevClient
	// The flags above exist only in JetBrains Runtime; any other JVM refuses to start.
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(project.jbr_version as int)
		vendor = JvmVendorSpec.JETBRAINS
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Minecraft-Client-Core, as a local module so it can be edited in place.
	implementation project(':core')
	// Core's combat library, likewise local. Brings :core with it.
	implementation project(':combat')
	// Core's projectile and GUI libraries, likewise local.
	implementation project(':projectile')
	implementation project(':gui')

	// Lombok, compile-time only: nothing lands in the jar, and no mod that depends
	// on this one needs it. Declared for both source sets because Loom's
	// splitEnvironmentSourceSets() gives `client` its own compile classpath, and an
	// annotation processor on `main` alone would silently not run there -- which
	// looks exactly like "@Getter did nothing".
	compileOnly "org.projectlombok:lombok:${lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${lombok_version}"
	clientCompileOnly "org.projectlombok:lombok:${lombok_version}"
	clientAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"

	nanovg("org.lwjgl:lwjgl-nanovg:${lwjgl_version}") { transitive = false }
	nanovg_natives.each { classifier ->
		nanovg("org.lwjgl:lwjgl-nanovg:${lwjgl_version}:${classifier}") { transitive = false }
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

processResources {
	def props = [
		mod_id           : project.mod_id,
		mod_name         : project.mod_name,
		version          : project.version,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version
	]

	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

jar {
	inputs.property 'archivesName', project.base.archivesName

	// Core and its libraries are plain libraries, not mods, so Loom will not nest them.
	// Fold their classes into the mod jar or the built mod hits
	// NoClassDefFoundError. evaluationDependsOn above is what makes their
	// sourceSets readable here.
	from project(':core').sourceSets.main.output
	from project(':combat').sourceSets.main.output
	from project(':projectile').sourceSets.main.output
	from project(':gui').sourceSets.main.output

	// Same for NanoVG and its natives: LWJGL finds a native by scanning the
	// classpath, so flattening the natives jars in is what makes them loadable.
	from(configurations.nanovg.collect { zipTree(it) }) {
		exclude 'META-INF/**', 'module-info.class'
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from('LICENSE') {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// The client package must not know the game exists: it is written against Core
// and the adapter's seams, and the adapter alone bridges to Minecraft. Checked on
// the compiled classes rather than the imports, because a fully qualified name in
// the source, or calling an adapter method that hands back a game type, puts the
// game into a class file without any import to grep for.
def clientPackage = 'dev/px/karatsuba/client'
def gameNamespaces = ['net/minecraft/', 'com/mojang/', 'net/fabricmc/', 'org/spongepowered/']

tasks.register('verifyClientIndependence') {
	group = 'verification'
	description = "Fails if anything in ${clientPackage.replace('/', '.')} references Minecraft, Fabric or Mixin."
	def classesDirs = sourceSets.client.output.classesDirs
	dependsOn tasks.named('compileClientJava')
	inputs.files(classesDirs)

	doLast {
		def violations = []
		classesDirs.each { dir ->
			def root = new File(dir, clientPackage)
			if (!root.exists()) {
				return
			}
			root.eachFileRecurse(groovy.io.FileType.FILES) { file ->
				if (!file.name.endsWith('.class')) {
					return
				}
				// Class and member references sit in the constant pool as plain
				// internal names, so a byte search finds every one of them.
				def bytes = new String(file.bytes, 'ISO-8859-1')
				def hits = gameNamespaces.findAll { bytes.contains(it) }
				if (hits) {
					violations << "  ${dir.toPath().relativize(file.toPath())} -> ${hits.join(', ')}"
				}
			}
		}
		if (violations) {
			throw new GradleException("The client package references the game. Reach it through an " +
					"adapter seam instead (see client/package-info.java):\n" + violations.join('\n'))
		}
	}
}

tasks.named('check') {
	dependsOn 'verifyClientIndependence'
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add publishing targets here.
	}
}
