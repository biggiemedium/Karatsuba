# The dev server's starting settings. Copied to dev/server/run/ only when that
# folder has none, so edit the live file there; change this one to change what a
# fresh run starts with.
#
# online-mode is also forced off by runServer's arguments.
online-mode=false
enforce-secure-profile=false
motd=Karatsuba dev server (Grim)
server-port=25565
max-players=4
gamemode=survival
difficulty=normal
spawn-protection=0
# Vanilla's own flight kick would get in before Grim's checks; let Grim judge.
allow-flight=true
view-distance=8
simulation-distance=8
level-name=world
