// Local copy of Minecraft-Client-Core (https://github.com/biggiemedium/Minecraft-Client-Core),
// at release 2.4.
//
// Built as a plain Java subproject so it can be edited in place: Karatsuba
// consumes it via `implementation project(':core')` instead of JitPack.
//
// Core has NO Minecraft on its classpath. That is deliberate: if this project
// compiles, Core is provably free of net.minecraft imports and can be dropped
// into a project for any game version. Do not add a Minecraft dependency here.

plugins {
    id 'java'
    // Checks, FakePlatform and RecordingLogger, shared with every library's tests
    // so they run headless the same way Core's do, and the NanoVG window every
    // library's visual harness opens.
    id 'java-test-fixtures'
}

group = 'dev.px'
version = '2.4'

// Kept at 8 (as upstream) so Core stays portable across game versions. The mod
// itself compiles at 21; depending on 8-targeted classes from 21 is fine.
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
}

// LWJGL natives for whatever machine this is being built on. Upstream's visual
// harness needs them; nothing in src/main does.
ext {
    lwjglVersion = '3.3.3'
    lwjglNatives = {
        String os = System.getProperty('os.name').toLowerCase()
        String arch = System.getProperty('os.arch').toLowerCase()
        boolean arm = arch.startsWith('aarch64') || arch.startsWith('arm')
        if (os.contains('mac')) {
            return arm ? 'natives-macos-arm64' : 'natives-macos'
        }
        if (os.contains('win')) {
            return 'natives-windows'
        }
        return arm ? 'natives-linux-arm64' : 'natives-linux'
    }()
}

// Upstream's suite is a plain main() with its own assertions, not JUnit, so the
// `test` task never sees it. This is how it gets run: `gradlew :core:smoke`.
tasks.register('smoke', JavaExec) {
    group = 'verification'
    description = 'Runs the Core test suite (no Minecraft, no render backend).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.px.core.test.CoreSmokeTest'
}

// A runnable visual harness: a real window, a real renderer, the real HUD.
tasks.register('visual', JavaExec) {
    group = 'verification'
    description = 'Opens a window and renders the HUD with NanoVG.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.px.core.test.visual.VisualTest'
    // GLFW must own the first thread on macOS, or creating a window aborts.
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

dependencies {
    // Lombok: compile-time only, nothing lands in the jar.
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Gson ships with Minecraft on every version, so it is compileOnly here.
    compileOnly 'com.google.code.gson:gson:2.8.9'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // The test suite uses Gson directly (SettingTests round-trips settings) and
    // runs with no Minecraft to supply it, so tests need it for real -- compileOnly
    // above does not reach the test classpaths.
    testImplementation 'com.google.code.gson:gson:2.8.9'

    // ---- visual harness only -------------------------------------------------
    // LWJGL + NanoVG, so the HUD and the GUI can be driven by a real renderer in
    // a real window. The backend lives in the test fixtures so every module's
    // harness shares it, and `api` so their tests compile against it. Test scope
    // on purpose: Core itself still has no dependencies, and `compileJava` still
    // proves it.
    testFixturesApi platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    testFixturesApi 'org.lwjgl:lwjgl'
    testFixturesApi 'org.lwjgl:lwjgl-glfw'
    testFixturesApi 'org.lwjgl:lwjgl-opengl'
    testFixturesApi 'org.lwjgl:lwjgl-nanovg'
    testFixturesRuntimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    testFixturesRuntimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    testFixturesRuntimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    testFixturesRuntimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"

    // The fixtures use Lombok like the rest of the tests.
    testFixturesCompileOnly 'org.projectlombok:lombok:1.18.30'
    testFixturesAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Core's own flow tests run in the test kit's sandbox. Test scope only: Core's
    // main code never imports it, and the kit depends on Core, not the other way.
    testImplementation project(':testkit')
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-unchecked' << '-parameters'
}
